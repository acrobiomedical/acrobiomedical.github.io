<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kcyeap 的匿名回饋</title>
    <meta name="description" content="kcyeap 的匿名回饋、職場建議、匿名告解與意見箱">
    <meta name="robots" content="noindex, nofollow">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                "Helvetica Neue",
                Arial,
                sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            min-height: 100%;
            background-color: #121214;
        }

        body {
            min-width: 320px;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 24px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            background-color: #121214;
            color: #e2e8f0;
        }

        body.menu-open {
            overflow: hidden;
        }

        .menu-toggle {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1100;

            width: 46px;
            height: 46px;
            padding: 10px;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 5px;

            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            cursor: pointer;

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            transition:
                background-color 0.2s ease,
                transform 0.2s ease;
        }

        .menu-toggle:hover,
        .menu-toggle:focus-visible {
            background: rgba(255, 255, 255, 0.16);
            transform: translateY(-1px);
            outline: none;
        }

        .menu-toggle:active {
            transform: scale(0.96);
        }

        .menu-toggle span {
            display: block;
            width: 25px;
            height: 2px;
            background-color: #ffffff;
            border-radius: 999px;
            transition:
                transform 0.25s ease,
                opacity 0.25s ease;
        }

        .menu-toggle.active span:nth-child(1) {
            transform: translateY(7px) rotate(45deg);
        }

        .menu-toggle.active span:nth-child(2) {
            opacity: 0;
        }

        .menu-toggle.active span:nth-child(3) {
            transform: translateY(-7px) rotate(-45deg);
        }

        .menu-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.58);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition:
                opacity 0.25s ease,
                visibility 0.25s ease;
        }

        .menu-overlay.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .side-menu {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1050;

            width: min(82vw, 320px);
            height: 100vh;
            height: 100dvh;
            padding: 28px 22px;

            display: flex;
            flex-direction: column;

            background: #1b1b1f;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 18px 0 40px rgba(0, 0, 0, 0.35);

            transform: translateX(-100%);
            visibility: hidden;
            pointer-events: none;

            transition:
                transform 0.28s cubic-bezier(0.4, 0, 0.2, 1),
                visibility 0.28s ease;
        }

        .side-menu.active {
            transform: translateX(0);
            visibility: visible;
            pointer-events: auto;
        }

        .side-menu-header {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 12px;
            padding: 4px 0 22px 58px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
        }

        .side-menu-header h2 {
            color: #ffffff;
            font-size: 1.15rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            line-height: 1;
        }

        .side-nav {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 26px;
        }

        .side-nav-link {
            min-height: 54px;
            padding: 0 15px;
            display: flex;
            align-items: center;
            gap: 13px;
            color: #e2e8f0;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 13px;
            transition:
                background-color 0.2s ease,
                color 0.2s ease,
                transform 0.2s ease;
        }

        .side-nav-link:hover,
        .side-nav-link:focus-visible {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.12);
            transform: translateX(3px);
            outline: none;
        }

        .nav-icon {
            width: 25px;
            color: #94a3b8;
            font-size: 1.2rem;
            text-align: center;
        }

        .side-menu-footer {
            margin-top: auto;
            padding-top: 22px;
            color: #64748b;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 0.7rem;
            letter-spacing: 1px;
            text-align: center;
        }

        .container {
            width: 100%;
            max-width: 390px;
            margin-top: 42px;
            padding: 45px 30px;
            text-align: center;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .profile-avatar {
            width: 90px;
            height: 90px;
            margin: 0 auto 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-color: #000000;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        }

        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            margin-bottom: 8px;
            color: #ffffff;
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .subtitle {
            margin-bottom: 35px;
            color: #94a3b8;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .ask-form {
            display: flex;
            flex-direction: column;
            gap: 14px;
            text-align: left;
        }

        .ask-box-title {
            padding-left: 4px;
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .ask-input {
            width: 100%;
            min-height: 120px;
            padding: 16px;
            resize: none;
            outline: none;
            color: #ffffff;
            background-color: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            font-size: 0.95rem;
            line-height: 1.5;
            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .ask-input:focus {
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.1);
        }

        .ask-input::placeholder {
            color: #475569;
        }

        .captcha-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: auto;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            color: #121214;
            background-color: #ffffff;
            border: none;
            border-radius: 14px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition:
                background-color 0.2s ease,
                transform 0.2s ease;
        }

        .submit-btn:hover,
        .submit-btn:focus-visible {
            background-color: #e2e8f0;
            transform: translateY(-1px);
            outline: none;
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        .botcheck {
            display: none;
        }

        .footer {
            margin-top: 50px;
            color: #475569;
            font-size: 0.7rem;
            letter-spacing: 1px;
        }

        @media (max-width: 480px) {
            body {
                padding: 15px;
            }

            .menu-toggle {
                top: 15px;
                left: 15px;
            }

            .side-menu {
                width: min(86vw, 320px);
            }

            .side-menu-header {
                padding: 4px 0 22px 58px;
            }

            .container {
                margin-top: 42px;
                padding: 38px 22px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>
<body>

    <button
        class="menu-toggle"
        id="menuToggle"
        type="button"
        aria-label="開啟網站選單"
        aria-controls="sideMenu"
        aria-expanded="false"
    >
        <span></span>
        <span></span>
        <span></span>
    </button>

    <div
        class="menu-overlay"
        id="menuOverlay"
        aria-hidden="true"
    ></div>

    <aside
        class="side-menu"
        id="sideMenu"
        aria-label="網站導覽"
        aria-hidden="true"
    >
        <div class="side-menu-header">
            <h2>網站選單</h2>
        </div>

        <nav class="side-nav" aria-label="主要導覽">
            
            <a
                class="side-nav-link"
                href="https://acrobiomedical.github.io/feedback/"
                target="_blank"
                rel="noopener noreferrer"
            >
                <span class="nav-icon" aria-hidden="true">⌂</span>

            <a

            <a

            </a>
            
            <a
                class="side-nav-link"
                href="https://open.spotify.com/playlist/4EHTIecLqrtTGIAhD3T57C?si=I7tkz64LRMmfkMCH4GdYdg&utm_source=copy-link&pi=cmt6jVnXRLm7w&sci=spotify%3Acard-config%3A5hVNRtDAQHz8UmSrYO5Og5"
                target="_blank"

            >
                <span class="nav-icon" aria-hidden="true">♬</span>
                <span>播放清單</span>
        </a>
        </nav>

        <div class="side-menu-footer">kcyeap</div>
    </aside>

    <main class="container">
        <div class="profile-avatar">
            <img src="260302.jpg" alt="kcyeap 頭像">
        </div>

        <h1>kcyeap</h1>

        <div class="subtitle">
            匿名回饋、職場建議、匿名告解、宣洩不滿、意見箱
        </div>

        <form
            class="ask-form"
            action="https://api.web3forms.com/submit"
            method="POST"
        >
            <input
                type="hidden"
                name="access_key"
                value="6a38455c-4159-4a3c-ba27-5f8f5d0c6349"
            >

            <input
                type="hidden"
                name="subject"
                value="kcyeap 匿名回饋"

                想對 kcyeap 說什麼？

            <textarea

        <div class="footer">
            © 2026 kcyeap. ALL RIGHTS RESERVED.
        </div>
    </main>

    <script
        src="https://web3forms.com/client/script.js"
        async
        defer
    ></script>

    <script>
        const menuToggle = document.getElementById("menuToggle");
        const sideMenu = document.getElementById("sideMenu");
        const menuOverlay = document.getElementById("menuOverlay");
        const sideNavLinks = document.querySelectorAll(".side-nav-link");

        function openMenu() {
            sideMenu.classList.add("active");
            menuOverlay.classList.add("active");
            menuToggle.classList.add("active");
            document.body.classList.add("menu-open");

            menuToggle.setAttribute("aria-expanded", "true");
            menuToggle.setAttribute("aria-label", "關閉網站選單");
            sideMenu.setAttribute("aria-hidden", "false");
            menuOverlay.setAttribute("aria-hidden", "false");
        }

        function closeMenu(restoreFocus = true) {
            sideMenu.classList.remove("active");
            menuOverlay.classList.remove("active");
            menuToggle.classList.remove("active");
            document.body.classList.remove("menu-open");

            menuToggle.setAttribute("aria-expanded", "false");
            menuToggle.setAttribute("aria-label", "開啟網站選單");
            sideMenu.setAttribute("aria-hidden", "true");
            menuOverlay.setAttribute("aria-hidden", "true");

            if (restoreFocus) {
                menuToggle.focus();
            }
        }

        menuToggle.addEventListener("click", () => {
            const isOpen = menuToggle.getAttribute("aria-expanded") === "true";
            if (isOpen) {
                closeMenu();
            } else {
                openMenu();
            }
        });

        menuOverlay.addEventListener("click", () => {
            closeMenu();
        });

        sideNavLinks.forEach((link) => {
            link.addEventListener("click", () => {
                closeMenu(false);
            });
        });

        document.addEventListener("keydown", (event) => {
            if (
                event.key === "Escape" &&
                menuToggle.getAttribute("aria-expanded") === "true"
            ) {
                closeMenu();
            }
        });
    </script>
</body>
</html>
